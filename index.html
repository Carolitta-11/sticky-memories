<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Sticky Note</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Shapes -->

    <div class="blob pink one"></div>
    <div class="blob peach two"></div>
    <div class="blob mint three"></div>
    <div class="blob blue four"></div>
    <div class="blob purple five"></div>

    <!-- Stars -->

    <div class="star s1">✦</div>
    <div class="star s2">✦</div>
    <div class="star s3">✦</div>
    <div class="star s4">✦</div>
    <div class="star s5">✦</div>

    <!-- Hearts -->

    <div class="heart h1">❤</div>
    <div class="heart h2">❤</div>
    <div class="heart h3">❤</div>
    <div class="heart h4">❤</div>
    <div class="heart h5">❤</div>

    <!-- Dots -->

    <div class="dots dots1">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="dots dots2">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <div class="dots dots3">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>

    <!-- Main Container -->

    <main class="container">

        <div class="sticky-note">

            <!-- Pin -->

            <div class="pin">
                <span class="head"></span>
                <span class="needle"></span>
            </div>

            <!-- Heading -->

            <h1>
                HI SOBA
                <span>🤩</span>
            </h1>

            <div class="divider">
                <span>❤</span>
            </div>

            <p class="subtitle">
                Check your Message <br>
                for today
            </p>

            <button class="open-btn">

                Open Today's Note

                <span class="icon">
                    ✉
                </span>

            </button>

        </div>

    </main>

</body>

</html>
