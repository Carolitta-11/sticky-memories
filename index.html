<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Sticky Memories</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Background Blobs -->
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>
    <div class="blob blob4"></div>

    <div class="overlay">

        <div class="welcome-card">

          <div class="welcome-card" id="homeCard">

    <h1>HI SOBA 🤩</h1>

    <p>Check your message for today</p>

    <button id="openNote">
        Open Today's Note
    </button>

</div>
            
<div class="envelope-container" id="envelopeContainer">

    <div class="envelope" id="envelope">

        <div class="flap"></div>

        <div class="letter-preview">
            💌
        </div>

    </div>

    <p class="tap-text">
        Tap the envelope
    </p>

</div>
            
<div class="note-card" id="noteCard">

    <h2>Today's Note 💛</h2>

    <p id="noteText">
        هنا هتظهر الرسالة
    </p>

    <button id="backBtn">
        Back
    </button>

</div>

    </div>

    <script src="messages.js"></script>
    <script src="script.js"></script>

</body>

</html>
